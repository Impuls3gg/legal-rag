[project]
name = "legal-rag"
version = "0.2.0"
description = "Локальный RAG-поиск по законодательству РФ (transformers + FAISS, без RAG-фреймворков)"
requires-python = ">=3.10"
dependencies = [
    # Только GPU. Сборка cu126 (см. tool.uv.sources) работает на GTX 16xx/RTX 20xx
    # (sm_75) и новее, драйвер должен быть >= 560.
    "torch>=2.4",
    "transformers>=4.56",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "tqdm>=4.66",
    "requests>=2.31",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Веб-интерфейс (src/legal_rag/web.py); для CLI не нужен.
web = ["streamlit>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# Дефолтный torch с PyPI собран под CUDA 13 и требует более свежий драйвер.
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
